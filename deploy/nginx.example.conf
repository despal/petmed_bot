# Пример nginx для PetMed Mini App + API

# server_name — ваш HTTPS-хост (DuckDNS и т.п.)
# ssl_certificate — Let's Encrypt

server {
    listen 443 ssl http2;
    server_name petmed.example.org;

    # ssl_certificate     /etc/letsencrypt/live/petmed.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/petmed.example.org/privkey.pem;

    root /var/www/petmed/miniapp/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
